components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      description: 参数无效 / Неверные параметры
  schemas:
    Error:
      properties:
        code:
          example: ALREADY_REGISTERED
          type: string
        message:
          example: 已经报名 / Участник уже записан
          type: string
      required:
      - code
      - message
      type: object
    Meeting:
      properties:
        id:
          example: 42
          minimum: 1
          type: integer
        location:
          example: Библиотека зал 2
          type: string
        startsAt:
          example: '2026-11-01T15:00:00+03:00'
          format: date-time
          type: string
        title:
          example: Мастер и Маргарита
          type: string
        description:
          type: string
          minLength: 10
          maxLength: 1000
          description: 规范化后描述；先去除首尾空白 / Описание после удаления краевых пробелов
        status:
          type: string
          enum:
          - draft
          - published
          - completed
          - cancelled
      required:
      - id
      - title
      - startsAt
      - location
      type: object
    Registration:
      properties:
        createdAt:
          example: '2026-10-20T12:00:00+03:00'
          format: date-time
          type: string
        id:
          example: 108
          minimum: 1
          type: integer
        meetingId:
          example: 42
          minimum: 1
          type: integer
        memberId:
          example: 17
          minimum: 1
          type: integer
      required:
      - id
      - meetingId
      - memberId
      - createdAt
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
info:
  title: 图书俱乐部 API / API Книжного клуба
  version: 1.0.0
openapi: 3.0.3
paths:
  /meetings:
    get:
      operationId: listMeetings
      parameters:
      - description: 返回数量 / Число результатов
        in: query
        name: limit
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
      - description: 跳过数量 / Число пропущенных записей
        in: query
        name: offset
        schema:
          default: 0
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Meeting'
                type: array
          description: 列表 可为空 / Список может быть пустым
        '400':
          $ref: '#/components/responses/BadRequest'
      summary: 获取活动列表 / Получить список встреч
  /meetings/{id}/registrations:
    post:
      description: 当前用户由令牌确定 无需请求体 Участник определяется по токену Тело не требуется
      operationId: registerForMeeting
      parameters:
      - description: 活动编号 / Идентификатор встречи
        example: 42
        in: path
        name: id
        required: true
        schema:
          minimum: 1
          type: integer
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registration'
          description: 报名已创建 / Запись создана
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 令牌缺失或无效 / Токен отсутствует или неверен
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 活动不存在 / Встреча не найдена
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 已经报名 / Участник уже записан
      security:
      - bearerAuth: []
      summary: 报名活动 / Записаться на встречу
  /meetings/{id}/status:
    patch:
      operationId: changeMeetingStatus
      summary: 修改活动状态 / Изменить статус встречи
      description: 组织者按 FR-STATUS 规则修改活动状态。 / Организатор меняет статус встречи по правилам FR-STATUS.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - draft
                  - published
                  - completed
                  - cancelled
      responses:
        '200':
          description: 状态已更新 / Статус обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meeting'
        '400':
          description: INVALID_STATUS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 令牌缺失或无效 / Нет действительного токена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: ROLE_FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 活动不存在 / Встреча не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: INVALID_STATUS_TRANSITION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
