name: BookClub checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v3
        with:
          python-version: '3.10'
      - name: Install test tools
        run: python -m pip install flake8 pytest
      - name: Check Python
        run: flake8 bookclub tests tools --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: python -m pytest -q
      - name: Check documents
        run: python -B -X utf8 tools/check_docs.py
